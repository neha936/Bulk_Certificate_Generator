services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: certs
      POSTGRES_PASSWORD: certs
      POSTGRES_DB: certificates
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certs -d certificates"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://certs:certs@db:5432/certificates
      ENVIRONMENT: docker
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      # Keep generated PDFs across container restarts and rebuilds.
      - certificates:/app/storage/certificates
    depends_on:
      db:
        condition: service_healthy   # don't start until Postgres accepts connections
    restart: unless-stopped

volumes:
  pgdata:
  certificates:
